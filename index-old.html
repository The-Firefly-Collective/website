<html lang="en">
  <head>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet" />
    <style>
      :root {
        --ff-bg: #1a1122;
        --ff-surface: #241533;
        --ff-accent: #ffa726;
        --ff-text: #ffffff;
        --ff-text-soft: rgba(255, 255, 255, 0.76);
        --ff-text-muted: rgba(255, 255, 255, 0.5);
        --ff-border: rgba(255, 255, 255, 0.1);
        --ff-radius-xl: 32px;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--ff-bg);
        color: var(--ff-text);
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      .ff-container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      /* Navigation */
      .ff-topbar {
        position: sticky;
        top: 0;
        background: rgba(26, 17, 34, 0.95);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--ff-border);
        z-index: 100;
      }
      .ff-topbar__inner {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .ff-logo {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0.1em;
        cursor: pointer;
        color: var(--ff-text);
        text-decoration: none;
      }
      .ff-nav {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .ff-nav a {
        color: var(--ff-text-soft);
        text-decoration: none;
        cursor: pointer;
        transition: 0.3s;
      }
      .ff-nav a:hover,
      .ff-nav a.active {
        color: var(--ff-accent);
      }
      .ff-nav-cta {
        background: rgba(255, 167, 38, 0.1);
        border: 1px solid var(--ff-accent);
        color: var(--ff-accent) !important;
        padding: 10px 22px;
        border-radius: 999px;
      }
      .ff-nav-cta:hover {
        background: var(--ff-accent) !important;
        color: #1a1122 !important;
      }

      /* Mobile Nav */
      /* Hamburger Button Styling */
      .ff-menu-toggle {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 1100; /* Above the nav overlay */
      }

      .ff-menu-toggle .bar {
        width: 25px;
        height: 2px;
        background-color: var(--ff-accent);
        transition: 0.3s;
      }

      /* Mobile Media Query */
      @media (max-width: 992px) {
        /* Adjust breakpoint as needed */
        .ff-menu-toggle {
          display: flex;
        }

        .ff-nav {
          display: none; /* Hide by default on mobile */
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background: var(--ff-bg, #1a1a1a); /* Matches your theme */
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 2rem;
          z-index: 1000;
        }

        .ff-nav.is-active {
          display: flex; /* Show when active */
        }

        /* Hamburger to X Animation */
        .ff-menu-toggle.is-active .bar:nth-child(1) {
          transform: translateY(8px) rotate(45deg);
        }
        .ff-menu-toggle.is-active .bar:nth-child(2) {
          opacity: 0;
        }
        .ff-menu-toggle.is-active .bar:nth-child(3) {
          transform: translateY(-8px) rotate(-45deg);
        }
      }
      /* Transitions */
      #page-content {
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
        padding: 60px 0;
        min-height: 70vh;
      }
      .fade-out {
        opacity: 0;
        transform: translateY(10px);
      }

      .ff-hero h1 {
        font-family: "Montserrat", sans-serif;
        font-size: clamp(2.5rem, 5vw, 4.4rem);
        line-height: 1.1;
        margin: 0;
      }
      .ff-hero .sub {
        font-size: 20px;
        color: var(--ff-text-soft);
        margin-top: 24px;
        max-width: 800px;
        line-height: 1.5;
      }

      /* Story Box */
      .ff-story-box {
        background: linear-gradient(145deg, rgba(255, 167, 38, 0.06), transparent);
        border: 1px solid rgba(255, 167, 38, 0.15);
        border-radius: var(--ff-radius-xl);
        padding: 48px;
        margin: 56px 0;
        position: relative;
      }
      .ff-story-box p {
        font-size: 18px;
        line-height: 1.8;
        color: var(--ff-text-soft);
        font-style: italic;
        margin-bottom: 24px;
      }
      .ff-story-box h3 {
        color: var(--ff-accent);
        margin-top: 0;
        font-size: 24px;
      }

      /* Grids */
      .ff-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 28px;
        margin-top: 48px;
      }
      .ff-grid--full {
        grid-template-columns: 1fr;
      }
      .ff-card {
        background: var(--ff-surface);
        border: 1px solid var(--ff-border);
        border-radius: var(--ff-radius-xl);
        padding: 36px;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
      }
      .ff-card:hover {
        transform: translateY(-5px);
        border-color: var(--ff-accent);
      }
      .ff-card h3 {
        color: var(--ff-accent);
        margin-top: 0;
        font-size: 24px;
        font-family: "Montserrat", sans-serif;
      }
      .ff-card p {
        font-size: 16px;
        color: var(--ff-text-soft);
        line-height: 1.6;
        flex-grow: 1;
      }

      /* Accordion */
      .ff-accordion {
        margin: 32px 0;
        border-top: 1px solid var(--ff-border);
      }
      .ff-accordion details {
        border-bottom: 1px solid var(--ff-border);
        padding: 24px 0;
      }
      .ff-accordion summary {
        font-size: 20px;
        font-weight: 700;
        color: var(--ff-accent);
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .ff-accordion summary::after {
        content: "+";
        font-size: 24px;
        transition: 0.3s;
      }
      .ff-accordion details[open] summary::after {
        content: "-";
        transform: rotate(90deg);
      }
      .ff-accordion-content {
        padding-top: 24px;
        color: var(--ff-text-soft);
        line-height: 1.8;
      }
      .ff-accordion-content h4 {
        color: var(--ff-accent);
        margin-bottom: 8px;
        font-size: 18px;
      }

      /* Extras */
      .ff-tag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ff-accent);
        opacity: 0.7;
        margin-bottom: 12px;
        font-weight: 700;
      }
      .ff-link {
        margin-top: 24px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ff-accent);
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ff-impact-list {
        list-style: none;
        padding: 0;
        margin: 24px 0 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        border-top: 1px solid var(--ff-border);
        padding-top: 24px;
      }
      .ff-impact-list li {
        font-size: 14px;
        color: var(--ff-text-soft);
      }
      .ff-impact-list span {
        color: var(--ff-accent);
        font-weight: bold;
        font-size: 18px;
        margin-right: 4px;
      }
      .ff-btn {
        display: inline-block;
        background: var(--ff-accent);
        color: #1a1122;
        padding: 14px 32px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        font-family: inherit;
        margin-top: 32px;
        transition: 0.2s;
      }
      .ff-btn:hover {
        opacity: 0.9;
        transform: scale(1.02);
      }
      .ff-btn--outline {
        background: transparent;
        border: 1px solid var(--ff-border);
        color: var(--ff-text);
        margin-left: 12px;
      }
      .ff-form-container {
        background: rgba(0, 0, 0, 0.15);
        padding: 40px;
        border-radius: var(--ff-radius-xl);
        border: 1px dashed var(--ff-border);
        margin-top: 40px;
        text-align: center;
      }

      footer {
        padding: 80px 0;
        border-top: 1px solid var(--ff-border);
        text-align: center;
        color: var(--ff-text-muted);
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .ff-nav {
          display: none;
        } /* Mobile menu needed later */
        .ff-hero h1 {
          font-size: 2.5rem;
        }
      }
      /* Dashboard Grid */
.ff-stat-grid {

    </style>

      function showPage(key) {
        const container = document.getElementById("page-content");
        container.classList.add("fade-out");

        setTimeout(() => {
          const p = pages[key];
          let gridClass = p.layout === "full" ? "ff-grid ff-grid--full" : "ff-grid";

          container.innerHTML = `
          <div class="ff-hero">
            <h1>${p.title}</h1>
            <p class="sub">${p.sub}</p>
            ${p.cta || ""}
          </div>
          ${p.story || ""}
          <div class="${gridClass}">
            ${p.cards
              .map(
                (c, index) => `
              <div class="ff-card">
                ${c.tag ? `<div class="ff-tag">${c.tag}</div>` : ""}
                <h3>${c.h}</h3>
                <p>${c.p}</p>
                ${c.impactList ? `<ul class="ff-impact-list">${c.impactList.map((i) => `<li><span>${i[0]}</span> = ${i[1]}</li>`).join("")}</ul>` : ""}
                ${c.linkText ? `<a onclick="${c.fullContent ? `showDetail('${key}', ${index})` : `showPage('${c.action || key}')`}" class="ff-link" role="button" tabindex="0">${c.linkText}</a>` : ""}
              </div>
            `
              )
              .join("")}
          </div>
        `;

          container.classList.remove("fade-out");

          // Update Nav
          document.querySelectorAll(".ff-nav a").forEach((a) => a.classList.remove("active"));
          const activeLink = document.getElementById(`link-${key}`);
          if (activeLink) activeLink.classList.add("active");

          window.scrollTo(0, 0);
        }, 400);
      }

      function showDetail(pageKey, cardIndex) {
        const container = document.getElementById("page-content");
        container.classList.add("fade-out");
        setTimeout(() => {
          container.innerHTML = pages[pageKey].cards[cardIndex].fullContent;
          container.classList.remove("fade-out");
          window.scrollTo(0, 0);
        }, 400);
      }

      window.onload = () => showPage("home");
function renderImpactPage() {
  const data = pages.impact;
  const container = document.getElementById('page-impact');
  if (!container) return;

  const cardsHtml = data.cards.map(card => {
    let listHtml = '';
    if (card.impactList) {
      listHtml = `<div class="ff-impact-list">
        ${card.impactList.map(item => `
          <div class="ff-impact-item">
            <span class="ff-accent-value">${item[0]}</span>
            <span class="ff-item-label">${item[1]}</span>
          </div>
        `).join('')}
      </div>`;
    }

    return `
      <div class="ff-stat-card">
        <h3>${card.h}</h3>
        <p>${card.p}</p>
        ${listHtml}
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="ff-container">
      <h1 class="ff-title">${data.title}</h1>
      <p class="ff-subtitle">${data.sub}</p>
      ${data.story}
      <div class="ff-stat-grid">${cardsHtml}</div>
    </div>
  `;
}

        menuToggle.classList.toggle("is-active");
        navMenu.classList.toggle("is-active");

        // Prevent background scrolling when menu is open
        document.body.style.overflow = navMenu.classList.contains("is-active") ? "hidden" : "auto";
      }

      function handleNav(pageKey) {
        // Call your existing SPA function
        showPage(pageKey);

        // Close the menu if we are on mobile

    <script>
    const FALLBACK_STATS = { visits: 40, costPerVisit: "3.53" }; // Your safety net

async function updateImpactStats() {
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_owYH4w5yghpplmh4CZ7IFSY6L0InArQ-kLcNMTQLcK-IZDXhFuV7CpbYVy6NNvzb/exec';
  
try {
    const response = await fetch(SCRIPT_URL);
    const liveData = await response.json();

    // 1. Update the 'Direct Care Stats' card (index 0)
    pages.impact.cards[0].impactList[0][0] = `$${liveData.costPerVisit}`;
    
    // 2. Add or update a row for total visits in the first card
    pages.impact.cards[0].impactList[1][0] = liveData.visits;

    // 3. Update 'Restock Capacity' (index 1) with the live total impact
    pages.impact.cards[1].impactList[1][0] = `$${liveData.totalImpact}`;

    // Now render the page with the fresh numbers
    renderPage('impact');

  } catch (err) {
    console.error("Live data fetch failed:", err);
    renderImpactPage(); // Fallback to static values if the sheet is down
  }
}
      // Check if we have a previous successful fetch saved
    const cachedData = localStorage.getItem('ff_impact_cache');
    renderStats(cachedData ? JSON.parse(cachedData) : FALLBACK_STATS);
}

function renderStats(data) {
  document.getElementById('visit-count').innerText = data.visits;
  document.getElementById('cost-per-visit').innerText = data.costPerVisit;
  document.getElementById('total-impact').innerText = data.totalImpact; // New line
  document.getElementById('last-updated').innerText = data.lastUpdated;
}
