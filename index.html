        width: 25px;
        height: 2px;
        background-color: var(--ff-accent);
        transition: 0.3s;
      }

      @media (max-width: 992px) {
        /* Adjust breakpoint as needed */
        .ff-menu-toggle {
          display: flex;
        }

        .ff-nav {
          display: none; /* Hide by default on mobile */
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background: var(--ff-bg, #1a1a1a); /* Matches your theme */
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 2rem;
          z-index: 1000;
        }

        .ff-nav.is-active {
          display: flex; /* Show when active */
        }

        /* Hamburger to X Animation */
        .ff-menu-toggle.is-active .bar:nth-child(1) {
          transform: translateY(8px) rotate(45deg);
        }
        .ff-menu-toggle.is-active .bar:nth-child(2) {
          opacity: 0;
        }
        .ff-menu-toggle.is-active .bar:nth-child(3) {
          transform: translateY(-8px) rotate(-45deg);
        }

        justify-content: space-between;
        align-items: center;

        display: flex;
        flex-direction: column;
        gap: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 16px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        font-size: 1.1rem;
        background: rgba(255, 215, 0, 0.1); /* Subtle gold glow */

        border-radius: 4px;

        font-size: 0.8rem;
        text-transform: uppercase;
        opacity: 0.6;

              <div style="max-width:800px; margin:0 auto; text-align:left;">
                <h2 style="color:var(--ff-accent); font-size:32px; margin-bottom:16px;">Naloxone Basics: Saving a Life</h2>
                <p style="font-size:18px; margin-bottom:40px;">Overdose deaths are preventable. Knowing how to respond with presence and preparation can change everything.</p>

                <div class="ff-accordion">
                  <details open>
                    <summary>Step 1: Recognizing an Overdose</summary>
                    <div class="ff-accordion-content">
                      <h4>What to Look For</h4>
                      <p>An overdose is a medical emergency. Seconds matter. Look for these signs:</p>
                      <ul>
                        <li><strong>Breathing:</strong> Slow, shallow, gurgling, or stopped breathing.</li>
                        <li><strong>Responsiveness:</strong> Person will not wake up to a loud shout or firm sternal rub.</li>
                        <li><strong>Color:</strong> Pale, gray, or blue-tinged lips, fingernails, or skin.</li>
                        <li><strong>Physical:</strong> Limp body and pinpoint pupils.</li>
                      </ul>
                    </div>
                  </details>

                  <details>
                    <summary>Step 2: The Firefly 5-Step Protocol</summary>
                    <div class="ff-accordion-content">
                      <h4>The Response Protocol</h4>
                      <ol>
                        <li><strong>Check:</strong> Shout their name and perform a "sternal rub" (rub your knuckles firmly on their breastbone).</li>
                        <li><strong>Give:</strong> Administer Naloxone (Narcan). It starts working in 2–3 minutes. Wait at least 2 minutes before giving a second dose.</li>
                        <li><strong>Support:</strong> Put them in the <strong>rescue position</strong> (on their side) or support breathing if you are trained.</li>
                        <li><strong>Call:</strong> Call 911 if there is still no response after multiple doses.</li>
                        <li><strong>Stay:</strong> Stay with the person for about 45 minutes or until help arrives. They may be confused or in withdrawal—stay calm and kind.</li>
                      </ol>
                    </div>
                  </details>

                    <summary>Step 3: Aftercare & Legal Protection</summary>
                    <div class="ff-accordion-content">
                      <h4>Dignity After Reversal</h4>
                      <p>Waking up from an overdose can be traumatic. Offer a blanket, water, and a listening ear. Do not judge or lecture; your presence is the support they need.</p>
                      <h4>Georgia's Good Samaritan Law</h4>
                      <p>In Georgia, you and the person overdosing are protected from certain drug possession charges when you call 911 in good faith to seek medical assistance for an overdose.</p>
                    </div>
                  </details>
                </div>
